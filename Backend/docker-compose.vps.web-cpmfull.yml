name: "${CONTAINER_PREFIX:-cpm-prd}-cpmfull"

services:
  web-cpmfull:
    container_name: "${CONTAINER_PREFIX:-cpm-prd}-cpmfull"
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.web.cpmfull
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${LANDING_PORT:-5088}:${LANDING_PORT:-5088}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      DEPLOY_PROFILE: "${DEPLOY_PROFILE:-production}"
      ASPNETCORE_URLS: "http://+:${LANDING_PORT:-5088}"
      URLS: "http://+:${LANDING_PORT:-5088}"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST:-mssql},1433;Database=${DB_NAME};User Id=${DB_USER};Password='${DB_PASSWORD}';TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True;Connection Timeout=30;"
      Chatwoot__Enabled: "${CPMFULL_CHATWOOT_ENABLED:-false}"
      Chatwoot__BaseUrl: "${CPMFULL_CHATWOOT_BASE_URL:-}"
      Chatwoot__ApiAccessToken: "${CPMFULL_CHATWOOT_API_ACCESS_TOKEN:-}"
      Chatwoot__AccountId: "${CPMFULL_CHATWOOT_ACCOUNT_ID:-0}"
      Chatwoot__ClientsInboxId: "${CPMFULL_CHATWOOT_CLIENTS_INBOX_ID:-0}"
      Chatwoot__ProvidersInboxId: "${CPMFULL_CHATWOOT_PROVIDERS_INBOX_ID:-0}"
      Chatwoot__WebhookSecret: "${CPMFULL_CHATWOOT_WEBHOOK_SECRET:-}"
      Chatwoot__RequestTimeoutSeconds: "${CPMFULL_CHATWOOT_REQUEST_TIMEOUT_SECONDS:-15}"
      Chatwoot__MaxRetryAttempts: "${CPMFULL_CHATWOOT_MAX_RETRY_ATTEMPTS:-3}"
      Chatwoot__RetryBaseDelayMs: "${CPMFULL_CHATWOOT_RETRY_BASE_DELAY_MS:-500}"
      Chatwoot__RetryWorkerEnabled: "${CPMFULL_CHATWOOT_RETRY_WORKER_ENABLED:-true}"
      Chatwoot__RetryWorkerIntervalSeconds: "${CPMFULL_CHATWOOT_RETRY_WORKER_INTERVAL_SECONDS:-30}"
      Chatwoot__RetryWorkerBatchSize: "${CPMFULL_CHATWOOT_RETRY_WORKER_BATCH_SIZE:-20}"
      Chatwoot__SyncQueueMaxAttempts: "${CPMFULL_CHATWOOT_SYNC_QUEUE_MAX_ATTEMPTS:-10}"
      Chatwoot__AllowedWebhookIps: "${CPMFULL_CHATWOOT_ALLOWED_WEBHOOK_IPS:-}"
      Chatwoot__WebhookPayloadCleanupEnabled: "${CPMFULL_CHATWOOT_WEBHOOK_PAYLOAD_CLEANUP_ENABLED:-true}"
      Chatwoot__WebhookPayloadRetentionDays: "${CPMFULL_CHATWOOT_WEBHOOK_PAYLOAD_RETENTION_DAYS:-14}"
      Chatwoot__WebhookPayloadCleanupIntervalMinutes: "${CPMFULL_CHATWOOT_WEBHOOK_PAYLOAD_CLEANUP_INTERVAL_MINUTES:-360}"
      TelegramAutomation__Enabled: "${TELEGRAM_AUTOMATION_ENABLED:-false}"
      TelegramAutomation__ClientsAutomationEnabled: "${TELEGRAM_AUTOMATION_CLIENTS_ENABLED:-true}"
      TelegramAutomation__ProvidersAutomationEnabled: "${TELEGRAM_AUTOMATION_PROVIDERS_ENABLED:-true}"
      TelegramAutomation__MirrorMessagesEnabled: "${TELEGRAM_AUTOMATION_MIRROR_MESSAGES_ENABLED:-false}"
      TelegramAutomation__RequireHumanHandoffForOutbound: "${TELEGRAM_AUTOMATION_REQUIRE_HANDOFF_FOR_OUTBOUND:-true}"
      TelegramAutomation__AllowedBotSources: "${TELEGRAM_AUTOMATION_ALLOWED_BOT_SOURCES:-telegram}"
      TelegramAutomation__TelegramBridgeBaseUrl: "${TELEGRAM_AUTOMATION_TELEGRAM_BRIDGE_BASE_URL:-http://${CONTAINER_PREFIX:-cpm-prd}-telegrambridge:${TELEGRAM_BRIDGE_PORT:-5175}}"
      TelegramAutomation__SharedSecret: "${TELEGRAM_AUTOMATION_SHARED_SECRET:-}"
      TelegramAutomation__RequestTimeoutSeconds: "${TELEGRAM_AUTOMATION_REQUEST_TIMEOUT_SECONDS:-15}"
      TelegramAutomation__DeliveryWorkerEnabled: "${TELEGRAM_AUTOMATION_DELIVERY_WORKER_ENABLED:-true}"
      TelegramAutomation__DeliveryWorkerIntervalSeconds: "${TELEGRAM_AUTOMATION_DELIVERY_WORKER_INTERVAL_SECONDS:-20}"
      TelegramAutomation__DeliveryWorkerBatchSize: "${TELEGRAM_AUTOMATION_DELIVERY_WORKER_BATCH_SIZE:-20}"
      TelegramAutomation__DeliveryQueueMaxAttempts: "${TELEGRAM_AUTOMATION_DELIVERY_QUEUE_MAX_ATTEMPTS:-10}"
      TelegramAutomation__DeliveryPayloadCleanupEnabled: "${TELEGRAM_AUTOMATION_DELIVERY_PAYLOAD_CLEANUP_ENABLED:-true}"
      TelegramAutomation__DeliveryPayloadRetentionDays: "${TELEGRAM_AUTOMATION_DELIVERY_PAYLOAD_RETENTION_DAYS:-14}"
      TelegramAutomation__DeliveryPayloadCleanupIntervalMinutes: "${TELEGRAM_AUTOMATION_DELIVERY_PAYLOAD_CLEANUP_INTERVAL_MINUTES:-360}"
    networks:
      - conserta_net

networks:
  conserta_net:
    external: true
