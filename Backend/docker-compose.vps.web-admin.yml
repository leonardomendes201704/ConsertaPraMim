name: backend-web-admin

services:
  web-admin:
    container_name: "${CONTAINER_PREFIX:-cpm}-web-admin"
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.web.admin
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${ADMIN_PORT:-5151}:${ADMIN_PORT:-5151}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:${ADMIN_PORT:-5151}"
      URLS: "http://+:${ADMIN_PORT:-5151}"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      ApiBaseUrl: "${INTERNAL_API_URL:-http://${CONTAINER_PREFIX:-cpm}-api:8080}"
      BrowserApiBaseUrl: "${PUBLIC_API_URL:-http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}}"
      Portals__ClientUrl: "${PUBLIC_CLIENT_URL:-http://${VPS_PUBLIC_HOST}:${CLIENT_PORT:-5069}}"
      Portals__ProviderUrl: "${PUBLIC_PROVIDER_URL:-http://${VPS_PUBLIC_HOST}:${PROVIDER_PORT:-5140}}"
      AdminWiki__DocumentationRootPath: "/app/Documentacao"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "ConsertaPraMim"
      JwtSettings__Audience: "ConsertaPraMimWebApps"
    volumes:
      - ../Documentacao:/app/Documentacao:ro
    networks:
      - conserta_net

networks:
  conserta_net:
    external: true
