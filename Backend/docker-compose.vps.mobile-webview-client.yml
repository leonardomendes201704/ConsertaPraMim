name: "${CONTAINER_PREFIX:-cpm-prd}-app-cliente"

services:
  mobile-webview-client:
    container_name: "${CONTAINER_PREFIX:-cpm-prd}-app-cliente"
    build:
      context: ..
      dockerfile: Backend/docker/vps/Dockerfile.mobile.webview.client
      args:
        VITE_API_BASE_URL: "${PUBLIC_API_URL:-http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}}"
    restart: unless-stopped
    ports:
      - "${MOBILE_CLIENT_WEBVIEW_PORT:-5181}:8080"
    networks:
      - conserta_net

networks:
  conserta_net:
    external: true
