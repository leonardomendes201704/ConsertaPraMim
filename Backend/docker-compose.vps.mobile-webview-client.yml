name: backend-mobile-webview-client

services:
  mobile-webview-client:
    container_name: cpm-mobile-webview-client
    build:
      context: ..
      dockerfile: Backend/docker/vps/Dockerfile.mobile.webview.client
      args:
        VITE_API_BASE_URL: "http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}"
    restart: unless-stopped
    ports:
      - "${MOBILE_CLIENT_WEBVIEW_PORT:-5181}:8080"
    networks:
      - conserta_net

networks:
  conserta_net:
    external: true
