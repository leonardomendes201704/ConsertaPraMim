name: "${CONTAINER_PREFIX:-cpm-prd}-cliente"

services:
  web-client:
    container_name: "${CONTAINER_PREFIX:-cpm-prd}-cliente"
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.web.client
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CLIENT_PORT:-5069}:${CLIENT_PORT:-5069}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:${CLIENT_PORT:-5069}"
      URLS: "http://+:${CLIENT_PORT:-5069}"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      ApiBaseUrl: "${INTERNAL_API_URL:-http://${CONTAINER_PREFIX:-cpm-prd}-api:8080}"
      BrowserApiBaseUrl: "${PUBLIC_API_URL:-http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "ConsertaPraMim"
      JwtSettings__Audience: "ConsertaPraMimWebApps"
      DataProtection__KeysPath: "/app/dataprotection-keys"
    volumes:
      - web_client_dataprotection:/app/dataprotection-keys
    networks:
      - conserta_net

volumes:
  web_client_dataprotection:
    name: "${VOLUME_PREFIX:-cpm_prd}_web_client_dataprotection"

networks:
  conserta_net:
    external: true
