services:
  api:
    container_name: cpm-api
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5193}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST:-mssql},1433;Database=${DB_NAME};User Id=${DB_USER};Password='${DB_PASSWORD}';TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True;Connection Timeout=30;"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "ConsertaPraMim"
      JwtSettings__Audience: "ConsertaPraMimWebApps"
      Seed__Enabled: "true"
      Seed__Reset: "false"
      Seed__CreateDefaultAdmin: "true"
      Seed__DefaultPassword: "${SEED_DEFAULT_PASSWORD}"
      Seed__ResetSecurityCode: "${SEED_RESET_SECURITY_CODE:-}"
      Cors__AllowedOrigins__0: "http://${VPS_PUBLIC_HOST}:${ADMIN_PORT:-5151}"
      Cors__AllowedOrigins__1: "http://${VPS_PUBLIC_HOST}:${CLIENT_PORT:-5069}"
      Cors__AllowedOrigins__2: "http://${VPS_PUBLIC_HOST}:${PROVIDER_PORT:-5140}"
      Cors__AllowedOrigins__3: "http://localhost:${ADMIN_PORT:-5151}"
      Cors__AllowedOrigins__4: "http://localhost:${CLIENT_PORT:-5069}"
      Cors__AllowedOrigins__5: "http://localhost:${PROVIDER_PORT:-5140}"
      Cors__AllowedOrigins__6: "http://${VPS_PUBLIC_HOST}:${MOBILE_CLIENT_WEBVIEW_PORT:-5181}"
      Cors__AllowedOrigins__7: "http://${VPS_PUBLIC_HOST}:${MOBILE_PROVIDER_WEBVIEW_PORT:-5182}"
      Cors__AllowedOrigins__8: "http://${VPS_PUBLIC_HOST}:${MOBILE_ADMIN_WEBVIEW_PORT:-5183}"
      Cors__AllowedOrigins__9: "http://localhost:${MOBILE_CLIENT_WEBVIEW_PORT:-5181}"
      Cors__AllowedOrigins__10: "http://localhost:${MOBILE_PROVIDER_WEBVIEW_PORT:-5182}"
      Cors__AllowedOrigins__11: "http://localhost:${MOBILE_ADMIN_WEBVIEW_PORT:-5183}"
      PushNotifications__Firebase__ServiceAccountPath: "${FIREBASE_SERVICE_ACCOUNT_PATH:-}"
      PushNotifications__Firebase__ServiceAccountJsonBase64: "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:-}"
      PushNotifications__Firebase__ProjectId: "${FIREBASE_PROJECT_ID:-}"
      PushNotifications__Firebase__ServerKey: "${FIREBASE_SERVER_KEY:-}"
      DeployNotifications__WebhookToken: "${APK_RELEASE_PUSH_TOKEN:-}"
    volumes:
      - api_uploads:/app/wwwroot/uploads
    networks:
      - conserta_net

  web-admin:
    container_name: cpm-web-admin
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.web.admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-5151}:${ADMIN_PORT:-5151}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:${ADMIN_PORT:-5151}"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      ApiBaseUrl: "http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}"
      AdminWiki__DocumentationRootPath: "/app/Documentacao"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "ConsertaPraMim"
      JwtSettings__Audience: "ConsertaPraMimWebApps"
    volumes:
      - ../Documentacao:/app/Documentacao:ro
    networks:
      - conserta_net

  web-client:
    container_name: cpm-web-client
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.web.client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${CLIENT_PORT:-5069}:${CLIENT_PORT:-5069}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:${CLIENT_PORT:-5069}"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      ApiBaseUrl: "http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "ConsertaPraMim"
      JwtSettings__Audience: "ConsertaPraMimWebApps"
      DataProtection__KeysPath: "/app/dataprotection-keys"
    volumes:
      - web_client_dataprotection:/app/dataprotection-keys
    networks:
      - conserta_net

  web-provider:
    container_name: cpm-web-provider
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.web.provider
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PROVIDER_PORT:-5140}:${PROVIDER_PORT:-5140}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:${PROVIDER_PORT:-5140}"
      ApiBaseUrl: "http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "ConsertaPraMim"
      JwtSettings__Audience: "ConsertaPraMimWebApps"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      DataProtection__KeysPath: "/app/dataprotection-keys"
    volumes:
      - web_provider_dataprotection:/app/dataprotection-keys
    networks:
      - conserta_net

  mobile-webview-client:
    container_name: cpm-mobile-webview-client
    build:
      context: ..
      dockerfile: Backend/docker/vps/Dockerfile.mobile.webview.client
      args:
        VITE_API_BASE_URL: "http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${MOBILE_CLIENT_WEBVIEW_PORT:-5181}:8080"
    networks:
      - conserta_net

  mobile-webview-provider:
    container_name: cpm-mobile-webview-provider
    build:
      context: ..
      dockerfile: Backend/docker/vps/Dockerfile.mobile.webview.provider
      args:
        VITE_API_BASE_URL: "http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${MOBILE_PROVIDER_WEBVIEW_PORT:-5182}:8080"
    networks:
      - conserta_net

  mobile-webview-admin:
    container_name: cpm-mobile-webview-admin
    build:
      context: ..
      dockerfile: Backend/docker/vps/Dockerfile.mobile.webview.admin
      args:
        VITE_API_BASE_URL: "http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${MOBILE_ADMIN_WEBVIEW_PORT:-5183}:8080"
    networks:
      - conserta_net

volumes:
  api_uploads:
  web_client_dataprotection:
  web_provider_dataprotection:

networks:
  conserta_net:
    external: true
