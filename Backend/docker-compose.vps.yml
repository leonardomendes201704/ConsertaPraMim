services:
  web-landing:
    container_name: "${CONTAINER_PREFIX:-cpm-prd}-landing"
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.web.landing
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${LANDING_PORT:-5088}:${LANDING_PORT:-5088}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:${LANDING_PORT:-5088}"
      URLS: "http://+:${LANDING_PORT:-5088}"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      LandingSite__CanonicalUrl: "${PUBLIC_LANDING_URL:-https://www.consertapramim.com}"
      LandingSite__ClientPortalUrl: "${PUBLIC_CLIENT_URL:-http://${VPS_PUBLIC_HOST}:${CLIENT_PORT:-5069}}"
      LandingSite__ProviderPortalUrl: "${PUBLIC_PROVIDER_URL:-http://${VPS_PUBLIC_HOST}:${PROVIDER_PORT:-5140}}"
      LandingSite__AdminPortalUrl: "${PUBLIC_ADMIN_URL:-http://${VPS_PUBLIC_HOST}:${ADMIN_PORT:-5151}}"
      LandingSite__ApiBaseUrl: "${PUBLIC_API_URL:-http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}}"
      LandingSite__ApiSwaggerUrl: "${PUBLIC_API_URL:-http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}}/swagger"
      LandingSite__InternalApiBaseUrl: "${INTERNAL_API_URL:-http://${CONTAINER_PREFIX:-cpm-prd}-api:8080}"
      LandingSite__InternalWebhookToken: "${APK_RELEASE_PUSH_TOKEN:-}"
    networks:
      - conserta_net

  api:
    container_name: "${CONTAINER_PREFIX:-cpm-prd}-api"
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.api
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${API_PORT:-5193}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:8080"
      DEPLOY_PROFILE: "${DEPLOY_PROFILE:-production}"
      VPS_PUBLIC_HOST: "${VPS_PUBLIC_HOST}"
      ADMIN_PORT: "${ADMIN_PORT:-5151}"
      CLIENT_PORT: "${CLIENT_PORT:-5069}"
      PROVIDER_PORT: "${PROVIDER_PORT:-5140}"
      MOBILE_CLIENT_WEBVIEW_PORT: "${MOBILE_CLIENT_WEBVIEW_PORT:-5181}"
      MOBILE_PROVIDER_WEBVIEW_PORT: "${MOBILE_PROVIDER_WEBVIEW_PORT:-5182}"
      MOBILE_ADMIN_WEBVIEW_PORT: "${MOBILE_ADMIN_WEBVIEW_PORT:-5183}"
      Security__EnforceHttpsRedirection: "${ENFORCE_API_HTTPS_REDIRECTION:-true}"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      ConnectionStrings__DefaultConnection: "Server=${DB_HOST:-mssql},1433;Database=${DB_NAME};User Id=${DB_USER};Password='${DB_PASSWORD}';TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True;Connection Timeout=30;"
      Portals__AdminUrl: "${PUBLIC_ADMIN_URL:-http://${VPS_PUBLIC_HOST}:${ADMIN_PORT:-5151}}"
      Portals__ClientUrl: "${PUBLIC_CLIENT_URL:-http://${VPS_PUBLIC_HOST}:${CLIENT_PORT:-5069}}"
      Portals__ProviderUrl: "${PUBLIC_PROVIDER_URL:-http://${VPS_PUBLIC_HOST}:${PROVIDER_PORT:-5140}}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "ConsertaPraMim"
      JwtSettings__Audience: "ConsertaPraMimWebApps"
      Seed__Enabled: "true"
      Seed__Reset: "false"
      Seed__CreateDefaultAdmin: "true"
      Seed__DefaultPassword: "${SEED_DEFAULT_PASSWORD}"
      Seed__ResetSecurityCode: "${SEED_RESET_SECURITY_CODE:-}"
      Cors__AllowedOrigins__0: "${PUBLIC_ADMIN_URL:-http://${VPS_PUBLIC_HOST}:${ADMIN_PORT:-5151}}"
      Cors__AllowedOrigins__1: "${PUBLIC_CLIENT_URL:-http://${VPS_PUBLIC_HOST}:${CLIENT_PORT:-5069}}"
      Cors__AllowedOrigins__2: "${PUBLIC_PROVIDER_URL:-http://${VPS_PUBLIC_HOST}:${PROVIDER_PORT:-5140}}"
      Cors__AllowedOrigins__3: "${PUBLIC_LANDING_URL:-https://www.consertapramim.com}"
      Cors__AllowedOrigins__4: "http://localhost:${ADMIN_PORT:-5151}"
      Cors__AllowedOrigins__5: "http://localhost:${CLIENT_PORT:-5069}"
      Cors__AllowedOrigins__6: "http://localhost:${PROVIDER_PORT:-5140}"
      Cors__AllowedOrigins__7: "http://${VPS_PUBLIC_HOST}:${MOBILE_CLIENT_WEBVIEW_PORT:-5181}"
      Cors__AllowedOrigins__8: "http://${VPS_PUBLIC_HOST}:${MOBILE_PROVIDER_WEBVIEW_PORT:-5182}"
      Cors__AllowedOrigins__9: "http://${VPS_PUBLIC_HOST}:${MOBILE_ADMIN_WEBVIEW_PORT:-5183}"
      Cors__AllowedOrigins__10: "http://localhost:${MOBILE_CLIENT_WEBVIEW_PORT:-5181}"
      Cors__AllowedOrigins__11: "http://localhost:${MOBILE_PROVIDER_WEBVIEW_PORT:-5182}"
      Cors__AllowedOrigins__12: "http://localhost:${MOBILE_ADMIN_WEBVIEW_PORT:-5183}"
      Cors__AllowedOrigins__13: "https://localhost"
      PushNotifications__Firebase__ServiceAccountPath: "${FIREBASE_SERVICE_ACCOUNT_PATH:-}"
      PushNotifications__Firebase__ServiceAccountJsonBase64: "${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:-}"
      PushNotifications__Firebase__ProjectId: "${FIREBASE_PROJECT_ID:-}"
      PushNotifications__Firebase__ServerKey: "${FIREBASE_SERVER_KEY:-}"
      DeployNotifications__WebhookToken: "${APK_RELEASE_PUSH_TOKEN:-}"
    volumes:
      - api_uploads:/app/wwwroot/uploads
    networks:
      - conserta_net

  web-admin:
    container_name: "${CONTAINER_PREFIX:-cpm-prd}-admin"
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.web.admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${BIND_HOST:-127.0.0.1}:${ADMIN_PORT:-5151}:${ADMIN_PORT:-5151}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:${ADMIN_PORT:-5151}"
      URLS: "http://+:${ADMIN_PORT:-5151}"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      ApiBaseUrl: "${INTERNAL_API_URL:-http://${CONTAINER_PREFIX:-cpm-prd}-api:8080}"
      BrowserApiBaseUrl: "${PUBLIC_API_URL:-http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}}"
      Portals__ClientUrl: "${PUBLIC_CLIENT_URL:-http://${VPS_PUBLIC_HOST}:${CLIENT_PORT:-5069}}"
      Portals__ProviderUrl: "${PUBLIC_PROVIDER_URL:-http://${VPS_PUBLIC_HOST}:${PROVIDER_PORT:-5140}}"
      MobileWebViews__ClientUrl: "${PUBLIC_MOBILE_CLIENT_WEBVIEW_URL:-http://${VPS_PUBLIC_HOST}:${MOBILE_CLIENT_WEBVIEW_PORT:-5181}}"
      MobileWebViews__ProviderUrl: "${PUBLIC_MOBILE_PROVIDER_WEBVIEW_URL:-http://${VPS_PUBLIC_HOST}:${MOBILE_PROVIDER_WEBVIEW_PORT:-5182}}"
      MobileWebViews__AdminUrl: "${PUBLIC_MOBILE_ADMIN_WEBVIEW_URL:-http://${VPS_PUBLIC_HOST}:${MOBILE_ADMIN_WEBVIEW_PORT:-5183}}"
      AdminWiki__DocumentationRootPath: "/app/Documentacao"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "ConsertaPraMim"
      JwtSettings__Audience: "ConsertaPraMimWebApps"
    volumes:
      - ../Documentacao:/app/Documentacao:ro
    networks:
      - conserta_net

  web-client:
    container_name: "${CONTAINER_PREFIX:-cpm-prd}-cliente"
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.web.client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CLIENT_PORT:-5069}:${CLIENT_PORT:-5069}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:${CLIENT_PORT:-5069}"
      URLS: "http://+:${CLIENT_PORT:-5069}"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      ApiBaseUrl: "${INTERNAL_API_URL:-http://${CONTAINER_PREFIX:-cpm-prd}-api:8080}"
      BrowserApiBaseUrl: "${PUBLIC_API_URL:-http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "ConsertaPraMim"
      JwtSettings__Audience: "ConsertaPraMimWebApps"
      DataProtection__KeysPath: "/app/dataprotection-keys"
    volumes:
      - web_client_dataprotection:/app/dataprotection-keys
    networks:
      - conserta_net

  web-provider:
    container_name: "${CONTAINER_PREFIX:-cpm-prd}-prestador"
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.web.provider
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PROVIDER_PORT:-5140}:${PROVIDER_PORT:-5140}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:${PROVIDER_PORT:-5140}"
      URLS: "http://+:${PROVIDER_PORT:-5140}"
      ApiBaseUrl: "${INTERNAL_API_URL:-http://${CONTAINER_PREFIX:-cpm-prd}-api:8080}"
      BrowserApiBaseUrl: "${PUBLIC_API_URL:-http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "ConsertaPraMim"
      JwtSettings__Audience: "ConsertaPraMimWebApps"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      DataProtection__KeysPath: "/app/dataprotection-keys"
    volumes:
      - web_provider_dataprotection:/app/dataprotection-keys
    networks:
      - conserta_net

  mobile-webview-client:
    container_name: "${CONTAINER_PREFIX:-cpm-prd}-app-cliente"
    build:
      context: ..
      dockerfile: Backend/docker/vps/Dockerfile.mobile.webview.client
      args:
        VITE_API_BASE_URL: "${PUBLIC_API_URL:-http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}}"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${MOBILE_CLIENT_WEBVIEW_PORT:-5181}:8080"
    networks:
      - conserta_net

  mobile-webview-provider:
    container_name: "${CONTAINER_PREFIX:-cpm-prd}-app-prestador"
    build:
      context: ..
      dockerfile: Backend/docker/vps/Dockerfile.mobile.webview.provider
      args:
        VITE_API_BASE_URL: "${PUBLIC_API_URL:-http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}}"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${MOBILE_PROVIDER_WEBVIEW_PORT:-5182}:8080"
    networks:
      - conserta_net

  mobile-webview-admin:
    container_name: "${CONTAINER_PREFIX:-cpm-prd}-app-admin"
    build:
      context: ..
      dockerfile: Backend/docker/vps/Dockerfile.mobile.webview.admin
      args:
        VITE_API_BASE_URL: "${PUBLIC_API_URL:-http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}}"
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${MOBILE_ADMIN_WEBVIEW_PORT:-5183}:8080"
    networks:
      - conserta_net

volumes:
  api_uploads:
    name: "${VOLUME_PREFIX:-cpm_prd}_api_uploads"
  web_client_dataprotection:
    name: "${VOLUME_PREFIX:-cpm_prd}_web_client_dataprotection"
  web_provider_dataprotection:
    name: "${VOLUME_PREFIX:-cpm_prd}_web_provider_dataprotection"

networks:
  conserta_net:
    external: true
