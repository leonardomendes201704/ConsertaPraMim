name: "${CONTAINER_PREFIX:-cpm-prd}-prestador"

services:
  web-provider:
    container_name: "${CONTAINER_PREFIX:-cpm-prd}-prestador"
    build:
      context: .
      dockerfile: docker/vps/Dockerfile.web.provider
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PROVIDER_PORT:-5140}:${PROVIDER_PORT:-5140}"
    environment:
      ASPNETCORE_ENVIRONMENT: "${APP_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:${PROVIDER_PORT:-5140}"
      URLS: "http://+:${PROVIDER_PORT:-5140}"
      ApiBaseUrl: "${INTERNAL_API_URL:-http://${CONTAINER_PREFIX:-cpm-prd}-api:8080}"
      BrowserApiBaseUrl: "${PUBLIC_API_URL:-http://${VPS_PUBLIC_HOST}:${API_PORT:-5193}}"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY}"
      JwtSettings__Issuer: "ConsertaPraMim"
      JwtSettings__Audience: "ConsertaPraMimWebApps"
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "false"
      LANG: "pt_BR.UTF-8"
      LC_ALL: "pt_BR.UTF-8"
      DataProtection__KeysPath: "/app/dataprotection-keys"
    volumes:
      - web_provider_dataprotection:/app/dataprotection-keys
    networks:
      - conserta_net

volumes:
  web_provider_dataprotection:
    name: "${VOLUME_PREFIX:-cpm_prd}_web_provider_dataprotection"

networks:
  conserta_net:
    external: true
