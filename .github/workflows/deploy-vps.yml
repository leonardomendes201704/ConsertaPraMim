name: Deploy VPS

on:
  push:
    branches: ["master", "main", "dev-local"]
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref_name }}
  cancel-in-progress: true

env:
  DEPLOY_PROFILE: ${{ github.ref_name == 'dev-local' && 'development' || 'production' }}
  API_PORT: ${{ github.ref_name == 'dev-local' && '6193' || '5193' }}
  LANDING_PORT: ${{ github.ref_name == 'dev-local' && '6088' || '5088' }}
  ADMIN_PORT: ${{ github.ref_name == 'dev-local' && '6151' || '5151' }}
  CLIENT_PORT: ${{ github.ref_name == 'dev-local' && '6069' || '5069' }}
  PROVIDER_PORT: ${{ github.ref_name == 'dev-local' && '6140' || '5140' }}
  MOBILE_CLIENT_WEBVIEW_PORT: ${{ github.ref_name == 'dev-local' && '6181' || '5181' }}
  MOBILE_PROVIDER_WEBVIEW_PORT: ${{ github.ref_name == 'dev-local' && '6182' || '5182' }}
  MOBILE_ADMIN_WEBVIEW_PORT: ${{ github.ref_name == 'dev-local' && '6183' || '5183' }}
  BIND_HOST: ${{ github.ref_name == 'dev-local' && '0.0.0.0' || '127.0.0.1' }}
  CONTAINER_PREFIX: ${{ github.ref_name == 'dev-local' && 'cpm-dev' || 'cpm' }}
  VOLUME_PREFIX: ${{ github.ref_name == 'dev-local' && 'cpm_dev' || 'cpm' }}
  DB_NAME: ${{ github.ref_name == 'dev-local' && 'ConsertaPraMimDbDev' || 'ConsertaPraMimDb' }}
  APK_SFTP_USER: "root"
  APK_SFTP_DIR: "/opt/filebrowser/srv/apks"

jobs:
  targets:
    name: Resolve Deploy Targets
    runs-on: [self-hosted, Linux, X64]
    environment: ${{ github.ref_name == 'dev-local' && 'development' || 'production' }}
    timeout-minutes: 10
    outputs:
      deploy_api: ${{ steps.targets.outputs.deploy_api }}
      deploy_web_landing: ${{ steps.targets.outputs.deploy_web_landing }}
      deploy_web_admin: ${{ steps.targets.outputs.deploy_web_admin }}
      deploy_web_client: ${{ steps.targets.outputs.deploy_web_client }}
      deploy_web_provider: ${{ steps.targets.outputs.deploy_web_provider }}
      deploy_mobile_webview_client: ${{ steps.targets.outputs.deploy_mobile_webview_client }}
      deploy_mobile_webview_provider: ${{ steps.targets.outputs.deploy_mobile_webview_provider }}
      deploy_mobile_webview_admin: ${{ steps.targets.outputs.deploy_mobile_webview_admin }}
      any: ${{ steps.targets.outputs.any }}
      build_apk_client: ${{ steps.apk_targets.outputs.build_apk_client }}
      build_apk_provider: ${{ steps.apk_targets.outputs.build_apk_provider }}
      build_apk_admin: ${{ steps.apk_targets.outputs.build_apk_admin }}
      any_work: ${{ steps.apk_targets.outputs.any_work }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          [ -n "${{ secrets.VPS_PUBLIC_HOST }}" ] || { echo "::error::Missing secret VPS_PUBLIC_HOST"; missing=1; }
          [ -n "${{ secrets.VPS_DB_PASSWORD }}" ] || { echo "::error::Missing secret VPS_DB_PASSWORD"; missing=1; }
          [ -n "${{ secrets.JWT_SECRET_KEY }}" ] || { echo "::error::Missing secret JWT_SECRET_KEY"; missing=1; }
          [ -n "${{ secrets.SEED_DEFAULT_PASSWORD }}" ] || { echo "::error::Missing secret SEED_DEFAULT_PASSWORD"; missing=1; }
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || { echo "::error::Missing secret VPS_SSH_KEY"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Detect changed projects
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            global:
              - '.github/workflows/deploy-vps.yml'
              - 'scripts/deploy/**'
              - 'Backend/.env.vps.example'
              - 'Backend/DEPLOY_VPS.md'
              - 'Backend/docker-compose.vps.yml'
              - 'Backend/docker-compose.vps.api.yml'
              - 'Backend/docker-compose.vps.web-landing.yml'
              - 'Backend/docker-compose.vps.web-admin.yml'
              - 'Backend/docker-compose.vps.web-client.yml'
              - 'Backend/docker-compose.vps.web-provider.yml'
            api:
              - 'Backend/src/ConsertaPraMim.API/**'
              - 'Backend/src/ConsertaPraMim.Application/**'
              - 'Backend/src/ConsertaPraMim.Domain/**'
              - 'Backend/src/ConsertaPraMim.Infrastructure/**'
              - 'Backend/docker/vps/Dockerfile.api'
            web_landing:
              - 'Backend/src/ConsertaPraMim.Web.Landing/**'
              - 'Backend/docker/vps/Dockerfile.web.landing'
            web_admin:
              - 'Backend/src/ConsertaPraMim.Web.Admin/**'
              - 'Backend/src/ConsertaPraMim.Application/**'
              - 'Backend/src/ConsertaPraMim.Domain/**'
              - 'Backend/docker/vps/Dockerfile.web.admin'
            web_client:
              - 'Backend/src/ConsertaPraMim.Web.Client/**'
              - 'Backend/src/ConsertaPraMim.Application/**'
              - 'Backend/src/ConsertaPraMim.Domain/**'
              - 'Backend/docker/vps/Dockerfile.web.client'
            web_provider:
              - 'Backend/src/ConsertaPraMim.Web.Provider/**'
              - 'Backend/src/ConsertaPraMim.Application/**'
              - 'Backend/src/ConsertaPraMim.Domain/**'
              - 'Backend/docker/vps/Dockerfile.web.provider'
            mobile_webview_shared:
              - '.github/workflows/deploy-vps.yml'
              - 'Backend/docker-compose.vps.mobile-webview-client.yml'
              - 'Backend/docker-compose.vps.mobile-webview-provider.yml'
              - 'Backend/docker-compose.vps.mobile-webview-admin.yml'
              - 'Backend/docker/vps/Dockerfile.mobile.webview.client'
              - 'Backend/docker/vps/Dockerfile.mobile.webview.provider'
              - 'Backend/docker/vps/Dockerfile.mobile.webview.admin'
              - 'Backend/docker/vps/nginx.mobile.webview.conf'
            mobile_webview_client:
              - 'conserta-pra-mim app/**'
            mobile_webview_provider:
              - 'conserta-pra-mim-provider app/**'
            mobile_webview_admin:
              - 'conserta-pra-mim-admin app/**'
            apk_shared:
              - '.github/workflows/deploy-vps.yml'
              - 'scripts/build_apks.py'
            apk_client:
              - 'conserta-pra-mim app/**'
            apk_provider:
              - 'conserta-pra-mim-provider app/**'
            apk_admin:
              - 'conserta-pra-mim-admin app/**'

      - name: Resolve deploy targets
        id: targets
        shell: bash
        run: |
          deploy_api="${{ steps.changes.outputs.api }}"
          deploy_web_landing="${{ steps.changes.outputs.web_landing }}"
          deploy_web_admin="${{ steps.changes.outputs.web_admin }}"
          deploy_web_client="${{ steps.changes.outputs.web_client }}"
          deploy_web_provider="${{ steps.changes.outputs.web_provider }}"
          deploy_mobile_webview_client="${{ steps.changes.outputs.mobile_webview_client }}"
          deploy_mobile_webview_provider="${{ steps.changes.outputs.mobile_webview_provider }}"
          deploy_mobile_webview_admin="${{ steps.changes.outputs.mobile_webview_admin }}"

          if [[ "${{ steps.changes.outputs.mobile_webview_shared }}" == "true" ]]; then
            deploy_mobile_webview_client="true"
            deploy_mobile_webview_provider="true"
            deploy_mobile_webview_admin="true"
          fi

          if [[ "${{ steps.changes.outputs.global }}" == "true" ]]; then
            deploy_api="true"
            deploy_web_landing="true"
            deploy_web_admin="true"
            deploy_web_client="true"
            deploy_web_provider="true"
            deploy_mobile_webview_client="true"
            deploy_mobile_webview_provider="true"
            deploy_mobile_webview_admin="true"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            deploy_api="true"
            deploy_web_landing="true"
            deploy_web_admin="true"
            deploy_web_client="true"
            deploy_web_provider="true"
            deploy_mobile_webview_client="true"
            deploy_mobile_webview_provider="true"
            deploy_mobile_webview_admin="true"
          fi

          any="false"
          if [[ "$deploy_api" == "true" || "$deploy_web_landing" == "true" || "$deploy_web_admin" == "true" || "$deploy_web_client" == "true" || "$deploy_web_provider" == "true" || "$deploy_mobile_webview_client" == "true" || "$deploy_mobile_webview_provider" == "true" || "$deploy_mobile_webview_admin" == "true" ]]; then
            any="true"
          fi

          echo "deploy_api=$deploy_api" >> "$GITHUB_OUTPUT"
          echo "deploy_web_landing=$deploy_web_landing" >> "$GITHUB_OUTPUT"
          echo "deploy_web_admin=$deploy_web_admin" >> "$GITHUB_OUTPUT"
          echo "deploy_web_client=$deploy_web_client" >> "$GITHUB_OUTPUT"
          echo "deploy_web_provider=$deploy_web_provider" >> "$GITHUB_OUTPUT"
          echo "deploy_mobile_webview_client=$deploy_mobile_webview_client" >> "$GITHUB_OUTPUT"
          echo "deploy_mobile_webview_provider=$deploy_mobile_webview_provider" >> "$GITHUB_OUTPUT"
          echo "deploy_mobile_webview_admin=$deploy_mobile_webview_admin" >> "$GITHUB_OUTPUT"
          echo "any=$any" >> "$GITHUB_OUTPUT"

      - name: Resolve APK build targets
        id: apk_targets
        shell: bash
        run: |
          apk_shared_changed="${{ steps.changes.outputs.apk_shared }}"
          apk_client_changed="${{ steps.changes.outputs.apk_client }}"
          apk_provider_changed="${{ steps.changes.outputs.apk_provider }}"
          apk_admin_changed="${{ steps.changes.outputs.apk_admin }}"

          if [[ "$apk_shared_changed" == "true" ]]; then
            apk_client_changed="true"
            apk_provider_changed="true"
            apk_admin_changed="true"
          fi

          apk_client_missing="false"
          apk_provider_missing="false"
          apk_admin_missing="false"

          vps_host_raw="${{ secrets.VPS_PUBLIC_HOST }}"
          vps_host_raw="${vps_host_raw//$'\r'/}"
          vps_host_raw="${vps_host_raw%/}"
          if [[ "$vps_host_raw" =~ ^https?:// ]]; then
            vps_host_raw="${vps_host_raw#http://}"
            vps_host_raw="${vps_host_raw#https://}"
          fi
          vps_host_raw="${vps_host_raw%%/*}"
          vps_host="${vps_host_raw%%:*}"

          if [[ -z "$vps_host" ]]; then
            echo "::warning::Nao foi possivel extrair host SSH de VPS_PUBLIC_HOST; forcando rebuild de APKs."
            apk_client_missing="true"
            apk_provider_missing="true"
            apk_admin_missing="true"
          else
            key_file="$(mktemp)"
            cleanup_key() {
              rm -f "$key_file"
            }
            trap cleanup_key EXIT

            key_raw='${{ secrets.VPS_SSH_KEY }}'
            if [[ "$key_raw" != *$'\n'* ]]; then
              key_raw="${key_raw//\\n/$'\n'}"
            fi
            key_raw="${key_raw//$'\r'/}"
            printf '%s\n' "$key_raw" > "$key_file"
            chmod 600 "$key_file"

            ssh_target="${{ env.APK_SFTP_USER }}@$vps_host"
            ssh_opts=(-i "$key_file" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)

            remote_file_exists() {
              local file_path="$1"
              ssh "${ssh_opts[@]}" "$ssh_target" "test -f '$file_path'" >/dev/null 2>&1
            }

            apk_base_dir="${{ env.APK_SFTP_DIR }}"

            client_debug="$apk_base_dir/debug/ConsertaPraMim-Cliente-debug.apk"
            client_compat="$apk_base_dir/ConsertaPraMim-Cliente-compat.apk"
            provider_debug="$apk_base_dir/debug/ConsertaPraMim-Prestador-debug.apk"
            provider_compat="$apk_base_dir/ConsertaPraMim-Prestador-compat.apk"
            admin_debug="$apk_base_dir/debug/ConsertaPraMim-Admin-debug.apk"
            admin_compat="$apk_base_dir/ConsertaPraMim-Admin-compat.apk"

            if ssh "${ssh_opts[@]}" "$ssh_target" "echo ok" >/dev/null 2>&1; then
              if ! remote_file_exists "$client_debug" || ! remote_file_exists "$client_compat"; then
                apk_client_missing="true"
              fi
              if ! remote_file_exists "$provider_debug" || ! remote_file_exists "$provider_compat"; then
                apk_provider_missing="true"
              fi
              if ! remote_file_exists "$admin_debug" || ! remote_file_exists "$admin_compat"; then
                apk_admin_missing="true"
              fi
            else
              echo "::warning::Nao foi possivel validar APKs no fileserver via SSH; forcando rebuild de APKs."
              apk_client_missing="true"
              apk_provider_missing="true"
              apk_admin_missing="true"
            fi
          fi

          build_apk_client="false"
          build_apk_provider="false"
          build_apk_admin="false"

          if [[ "$apk_client_changed" == "true" || "$apk_client_missing" == "true" ]]; then
            build_apk_client="true"
          fi
          if [[ "$apk_provider_changed" == "true" || "$apk_provider_missing" == "true" ]]; then
            build_apk_provider="true"
          fi
          if [[ "$apk_admin_changed" == "true" || "$apk_admin_missing" == "true" ]]; then
            build_apk_admin="true"
          fi

          any_apk_build="false"
          if [[ "$build_apk_client" == "true" || "$build_apk_provider" == "true" || "$build_apk_admin" == "true" ]]; then
            any_apk_build="true"
          fi

          any_work="false"
          if [[ "${{ steps.targets.outputs.any }}" == "true" || "$any_apk_build" == "true" ]]; then
            any_work="true"
          fi

          echo "build_apk_client=$build_apk_client" >> "$GITHUB_OUTPUT"
          echo "build_apk_provider=$build_apk_provider" >> "$GITHUB_OUTPUT"
          echo "build_apk_admin=$build_apk_admin" >> "$GITHUB_OUTPUT"
          echo "any_work=$any_work" >> "$GITHUB_OUTPUT"

      - name: Publish plan summary
        shell: bash
        run: |
          bool_icon() {
            case "$1" in
              true) echo "[YES]" ;;
              false) echo "[NO]" ;;
              *) echo "[?]" ;;
            esac
          }

          deploy_api="${{ steps.targets.outputs.deploy_api }}"
          health_api="$deploy_api"

          deploy_web_landing="${{ steps.targets.outputs.deploy_web_landing }}"
          health_web_landing="$deploy_web_landing"

          deploy_web_admin="${{ steps.targets.outputs.deploy_web_admin }}"
          health_web_admin="$deploy_web_admin"

          deploy_web_client="${{ steps.targets.outputs.deploy_web_client }}"
          health_web_client="$deploy_web_client"

          deploy_web_provider="${{ steps.targets.outputs.deploy_web_provider }}"
          health_web_provider="$deploy_web_provider"

          deploy_mobile_webview_client="${{ steps.targets.outputs.deploy_mobile_webview_client }}"
          health_mobile_webview_client="$deploy_mobile_webview_client"

          deploy_mobile_webview_provider="${{ steps.targets.outputs.deploy_mobile_webview_provider }}"
          health_mobile_webview_provider="$deploy_mobile_webview_provider"

          deploy_mobile_webview_admin="${{ steps.targets.outputs.deploy_mobile_webview_admin }}"
          health_mobile_webview_admin="$deploy_mobile_webview_admin"

          build_apk_client="${{ steps.apk_targets.outputs.build_apk_client }}"
          upload_apk_client="$build_apk_client"

          build_apk_provider="${{ steps.apk_targets.outputs.build_apk_provider }}"
          upload_apk_provider="$build_apk_provider"

          build_apk_admin="${{ steps.apk_targets.outputs.build_apk_admin }}"
          upload_apk_admin="$build_apk_admin"

          skip_deploy="false"
          if [[ "${{ steps.apk_targets.outputs.any_work }}" != "true" ]]; then
            skip_deploy="true"
          fi

          deploy_summary="true"

          {
            echo "## Deploy Plan"
            echo ""
            echo "- Profile: \`${{ env.DEPLOY_PROFILE }}\`"
            echo "- Host binding: \`${{ env.BIND_HOST }}\`"
            echo "- Ports: API=${{ env.API_PORT }}, Landing=${{ env.LANDING_PORT }}, Admin=${{ env.ADMIN_PORT }}, Cliente=${{ env.CLIENT_PORT }}, Prestador=${{ env.PROVIDER_PORT }}"
            echo ""
            echo "| No | Executa? |"
            echo "|---|---|"
            echo "| Resolve Deploy Targets | $(bool_icon "true") |"
            echo "| Deploy API | $(bool_icon "$deploy_api") |"
            echo "| Healthcheck API | $(bool_icon "$health_api") |"
            echo "| Deploy Web Landing | $(bool_icon "$deploy_web_landing") |"
            echo "| Healthcheck Web Landing | $(bool_icon "$health_web_landing") |"
            echo "| Deploy Web Admin | $(bool_icon "$deploy_web_admin") |"
            echo "| Healthcheck Web Admin | $(bool_icon "$health_web_admin") |"
            echo "| Deploy Web Client | $(bool_icon "$deploy_web_client") |"
            echo "| Healthcheck Web Client | $(bool_icon "$health_web_client") |"
            echo "| Deploy Web Provider | $(bool_icon "$deploy_web_provider") |"
            echo "| Healthcheck Web Provider | $(bool_icon "$health_web_provider") |"
            echo "| Deploy Mobile WebView Client | $(bool_icon "$deploy_mobile_webview_client") |"
            echo "| Healthcheck Mobile WebView Client | $(bool_icon "$health_mobile_webview_client") |"
            echo "| Deploy Mobile WebView Provider | $(bool_icon "$deploy_mobile_webview_provider") |"
            echo "| Healthcheck Mobile WebView Provider | $(bool_icon "$health_mobile_webview_provider") |"
            echo "| Deploy Mobile WebView Admin | $(bool_icon "$deploy_mobile_webview_admin") |"
            echo "| Healthcheck Mobile WebView Admin | $(bool_icon "$health_mobile_webview_admin") |"
            echo "| Build APK Mobile Client | $(bool_icon "$build_apk_client") |"
            echo "| Upload APK Mobile Client | $(bool_icon "$upload_apk_client") |"
            echo "| Build APK Mobile Provider | $(bool_icon "$build_apk_provider") |"
            echo "| Upload APK Mobile Provider | $(bool_icon "$upload_apk_provider") |"
            echo "| Build APK Mobile Admin | $(bool_icon "$build_apk_admin") |"
            echo "| Upload APK Mobile Admin | $(bool_icon "$upload_apk_admin") |"
            echo "| Skip Deploy | $(bool_icon "$skip_deploy") |"
            echo "| Deploy Summary | $(bool_icon "$deploy_summary") |"
            echo ""
            echo "_Obs.: o plano marca os nos elegiveis; falhas durante a execucao podem impedir nos dependentes._"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo "Evento: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-api:
    name: Deploy API
    needs: targets
    if: needs.targets.outputs.deploy_api == 'true'
    runs-on: [self-hosted, Linux, X64]
    environment: ${{ github.ref_name == 'dev-local' && 'development' || 'production' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write VPS env file
        shell: bash
        run: |
          APP_ENVIRONMENT_VALUE="${{ secrets.VPS_APP_ENVIRONMENT }}"
          if [[ -z "$APP_ENVIRONMENT_VALUE" ]]; then
            if [[ "${{ env.DEPLOY_PROFILE }}" == "development" ]]; then
              APP_ENVIRONMENT_VALUE="Development"
            else
              APP_ENVIRONMENT_VALUE="Production"
            fi
          fi

          VPS_PUBLIC_HOST_VALUE="${{ secrets.VPS_PUBLIC_HOST }}"
          VPS_PUBLIC_HOST_VALUE="${VPS_PUBLIC_HOST_VALUE#http://}"
          VPS_PUBLIC_HOST_VALUE="${VPS_PUBLIC_HOST_VALUE#https://}"
          VPS_PUBLIC_HOST_VALUE="${VPS_PUBLIC_HOST_VALUE%%/*}"
          VPS_PUBLIC_HOST_VALUE="${VPS_PUBLIC_HOST_VALUE%%:*}"
          PUBLIC_API_URL_VALUE="${{ secrets.PUBLIC_API_URL }}"
          PUBLIC_ADMIN_URL_VALUE="${{ secrets.PUBLIC_ADMIN_URL }}"
          PUBLIC_CLIENT_URL_VALUE="${{ secrets.PUBLIC_CLIENT_URL }}"
          PUBLIC_PROVIDER_URL_VALUE="${{ secrets.PUBLIC_PROVIDER_URL }}"
          PUBLIC_LANDING_URL_VALUE="${{ secrets.PUBLIC_LANDING_URL }}"
          ENFORCE_API_HTTPS_REDIRECTION_VALUE="${{ secrets.ENFORCE_API_HTTPS_REDIRECTION }}"

          if [[ "${{ env.DEPLOY_PROFILE }}" == "development" ]]; then
            PUBLIC_API_URL_VALUE="http://${VPS_PUBLIC_HOST_VALUE}:${{ env.API_PORT }}"
            PUBLIC_ADMIN_URL_VALUE="http://${VPS_PUBLIC_HOST_VALUE}:${{ env.ADMIN_PORT }}"
            PUBLIC_CLIENT_URL_VALUE="http://${VPS_PUBLIC_HOST_VALUE}:${{ env.CLIENT_PORT }}"
            PUBLIC_PROVIDER_URL_VALUE="http://${VPS_PUBLIC_HOST_VALUE}:${{ env.PROVIDER_PORT }}"
            PUBLIC_LANDING_URL_VALUE="http://${VPS_PUBLIC_HOST_VALUE}:${{ env.LANDING_PORT }}"
            if [[ -z "$ENFORCE_API_HTTPS_REDIRECTION_VALUE" ]]; then
              ENFORCE_API_HTTPS_REDIRECTION_VALUE="false"
            fi
          fi

          if [[ -z "$ENFORCE_API_HTTPS_REDIRECTION_VALUE" ]]; then
            ENFORCE_API_HTTPS_REDIRECTION_VALUE="true"
          fi

          cat > Backend/.env.vps <<EOF
          APP_ENVIRONMENT=$APP_ENVIRONMENT_VALUE
          DEPLOY_PROFILE=${{ env.DEPLOY_PROFILE }}
          BIND_HOST=${{ env.BIND_HOST }}
          CONTAINER_PREFIX=${{ env.CONTAINER_PREFIX }}
          VOLUME_PREFIX=${{ env.VOLUME_PREFIX }}
          INTERNAL_API_URL=http://${{ env.CONTAINER_PREFIX }}-api:8080
          VPS_PUBLIC_HOST=$VPS_PUBLIC_HOST_VALUE
          PUBLIC_API_URL=$PUBLIC_API_URL_VALUE
          PUBLIC_ADMIN_URL=$PUBLIC_ADMIN_URL_VALUE
          PUBLIC_CLIENT_URL=$PUBLIC_CLIENT_URL_VALUE
          PUBLIC_PROVIDER_URL=$PUBLIC_PROVIDER_URL_VALUE
          PUBLIC_LANDING_URL=$PUBLIC_LANDING_URL_VALUE
          ENFORCE_API_HTTPS_REDIRECTION=$ENFORCE_API_HTTPS_REDIRECTION_VALUE
          API_PORT=${{ env.API_PORT }}
          LANDING_PORT=${{ env.LANDING_PORT }}
          ADMIN_PORT=${{ env.ADMIN_PORT }}
          CLIENT_PORT=${{ env.CLIENT_PORT }}
          PROVIDER_PORT=${{ env.PROVIDER_PORT }}
          MOBILE_CLIENT_WEBVIEW_PORT=${{ env.MOBILE_CLIENT_WEBVIEW_PORT }}
          MOBILE_PROVIDER_WEBVIEW_PORT=${{ env.MOBILE_PROVIDER_WEBVIEW_PORT }}
          MOBILE_ADMIN_WEBVIEW_PORT=${{ env.MOBILE_ADMIN_WEBVIEW_PORT }}
          DB_NAME=${{ env.DB_NAME }}
          DB_USER=sa
          DB_PASSWORD=${{ secrets.VPS_DB_PASSWORD }}
          DB_HOST=${{ secrets.VPS_DB_HOST }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          SEED_DEFAULT_PASSWORD=${{ secrets.SEED_DEFAULT_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_PATH=${{ secrets.FIREBASE_SERVICE_ACCOUNT_PATH }}
          APK_RELEASE_PUSH_TOKEN=${{ secrets.APK_RELEASE_PUSH_TOKEN }}
          EOF

      - name: Deploy API
        shell: bash
        run: |
          echo "::group::Deploy API"
          chmod +x scripts/deploy/vps-deploy-service.sh
          export MSSQL_CONTAINER_NAME="${{ secrets.VPS_MSSQL_CONTAINER_NAME }}"
          export MSSQL_HOST_ALIAS="${{ secrets.VPS_MSSQL_HOST_ALIAS }}"
          export SKIP_GIT_PULL=1
          ./scripts/deploy/vps-deploy-service.sh "$GITHUB_WORKSPACE" api
          echo "::endgroup::"

  health-api:
    name: Healthcheck API
    needs: [targets, deploy-api]
    if: always() && needs.targets.outputs.deploy_api == 'true' && needs.deploy-api.result == 'success'
    runs-on: [self-hosted, Linux, X64]
    environment: ${{ github.ref_name == 'dev-local' && 'development' || 'production' }}
    timeout-minutes: 8
    outputs:
      endpoint: ${{ steps.health.outputs.endpoint }}
      http_code: ${{ steps.health.outputs.http_code }}
    steps:
      - name: Check API health endpoint
        id: health
        shell: bash
        run: |
          endpoint="http://127.0.0.1:${{ env.API_PORT }}/health"
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"

          attempts=12
          sleep_seconds=5
          code="000"
          for ((i=1; i<=attempts; i++)); do
            code="$(curl -k -sS -o /dev/null -w "%{http_code}" "$endpoint" || true)"
            echo "Attempt $i/$attempts -> HTTP $code"
