      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: conserta-pra-mim app/package-lock.json

      - name: Setup Java
        id: setup_java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Force Java 21 for Gradle/Keytool
        shell: pwsh
        run: |
          $javaHome = "${{ steps.setup_java.outputs.path }}"
          if ([string]::IsNullOrWhiteSpace($javaHome)) {
            throw "actions/setup-java nao retornou path do JDK."
          }
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$javaHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Write google-services.json (client)
        shell: pwsh
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_SERVICES_JSON_BASE64)) {
            throw "Secret ANDROID_GOOGLE_SERVICES_JSON_BASE64 ausente."
          }
