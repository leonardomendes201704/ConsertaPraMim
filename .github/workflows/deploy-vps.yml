  upload-apk-mobile-client:
    name: Upload APK Mobile Client
    needs: [targets, build-apk-mobile-client]
    if: |
      always() &&
      needs.targets.outputs.build_apk_client == 'true' &&
      needs.build-apk-mobile-client.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Download build artifact (client)
        uses: actions/download-artifact@v4
        with:
          name: apk-client-package-${{ github.run_number }}
          path: apk-upload/client

      - name: Publish APK fileserver (client)
        shell: bash
        run: |
          set -euo pipefail
          container_apk_dir="/srv/apks"
          container_debug_dir="/srv/apks/debug"

          docker exec --user 0 filebrowser sh -lc "mkdir -p '$container_apk_dir' '$container_debug_dir'"

          client_metadata_path="apk-upload/client/apk-publication-client.json"
          cat > "$client_metadata_path" <<EOF
          {
            "appKind": "client",
            "fileName": "ConsertaPraMim-Cliente-compat.apk",
            "publishedAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "releaseVersion": "${{ github.sha }}",
            "runId": "${{ github.run_id }}"
          }
          EOF

          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            if [[ "$base" == *-debug.apk ]]; then
              docker cp "$file" "filebrowser:$container_debug_dir/$base"
            else
              docker cp "$file" "filebrowser:$container_apk_dir/$base"
            fi
          done < <(find "apk-upload/client" -maxdepth 1 -type f -print0)

          docker exec --user 0 filebrowser sh -lc 'set -e; uid="$(id -u user 2>/dev/null || echo 0)"; gid="$(id -g user 2>/dev/null || echo 0)"; chown -R "$uid:$gid" /srv/apks; find /srv/apks -type d -exec chmod 775 {} \;; find /srv/apks -type f -exec chmod 664 {} \;;'

      - name: Publish APK metadata (client)
        shell: bash
        env:
          APK_RELEASE_PUSH_TOKEN: ${{ secrets.APK_RELEASE_PUSH_TOKEN }}
        run: |
          if [[ -z "${APK_RELEASE_PUSH_TOKEN:-}" ]]; then
            echo "::notice::Secret APK_RELEASE_PUSH_TOKEN nao configurada. Metadados de APK nao publicados."
            exit 0
          fi

          internal_api_base="http://127.0.0.1:${{ env.API_PORT }}"
          metadata_url="${internal_api_base}/api/internal/deploy/apk-publication"
          payload="$(cat <<EOF
          {
            "appKind":"client",
            "fileName":"ConsertaPraMim-Cliente-compat.apk",
            "publishedAtUtc":"$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "releaseVersion":"${{ github.sha }}",
            "runId":"${{ github.run_id }}"
          }
          EOF
          )"

          response_file="$(mktemp)"
          http_code="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$metadata_url" \
            -H "X-Deploy-Token: $APK_RELEASE_PUSH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" || true)"

          if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Metadado de APK client publicado com sucesso (HTTP $http_code)."
          else
            echo "::notice::Falha ao publicar metadado de APK client (HTTP ${http_code:-000})."
          fi

