          {
            echo "## Deploy"
            echo "Sem alteracoes relevantes para deploy."
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Deploy Summary
    needs:
      - targets
      - deploy-api
      - health-api
      - deploy-web-landing
      - health-web-landing
      - deploy-web-admin
      - health-web-admin
      - deploy-web-client
      - health-web-client
      - deploy-web-provider
      - health-web-provider
      - deploy-mobile-webview-client
      - health-mobile-webview-client
      - deploy-mobile-webview-provider
      - health-mobile-webview-provider
      - deploy-mobile-webview-admin
