    environment: ${{ github.ref_name == 'dev-local' && 'development' || 'production' }}
    timeout-minutes: 5
    steps:
      - name: Publish workflow summary
        shell: bash
        run: |
          result_icon() {
            case "$1" in
              success) echo "[OK]" ;;
              failure) echo "[FAIL]" ;;
              cancelled) echo "[CANCELLED]" ;;
              skipped) echo "[SKIPPED]" ;;
              *) echo "[UNKNOWN]" ;;
            esac
          }

          api_deploy_result="${{ needs.deploy-api.result }}"
          api_health_result="${{ needs.health-api.result }}"
          landing_deploy_result="${{ needs.deploy-web-landing.result }}"
          landing_health_result="${{ needs.health-web-landing.result }}"
          admin_deploy_result="${{ needs.deploy-web-admin.result }}"
          admin_health_result="${{ needs.health-web-admin.result }}"
          client_deploy_result="${{ needs.deploy-web-client.result }}"
          client_health_result="${{ needs.health-web-client.result }}"
          provider_deploy_result="${{ needs.deploy-web-provider.result }}"
          provider_health_result="${{ needs.health-web-provider.result }}"
          mobile_webview_client_deploy_result="${{ needs.deploy-mobile-webview-client.result }}"
          mobile_webview_client_health_result="${{ needs.health-mobile-webview-client.result }}"
          mobile_webview_provider_deploy_result="${{ needs.deploy-mobile-webview-provider.result }}"
          mobile_webview_provider_health_result="${{ needs.health-mobile-webview-provider.result }}"
          mobile_webview_admin_deploy_result="${{ needs.deploy-mobile-webview-admin.result }}"
          mobile_webview_admin_health_result="${{ needs.health-mobile-webview-admin.result }}"
          apk_client_build_result="${{ needs.build-apk-mobile-client.result }}"
          apk_client_upload_result="${{ needs.upload-apk-mobile-client.result }}"
          apk_provider_build_result="${{ needs.build-apk-mobile-provider.result }}"
          apk_provider_upload_result="${{ needs.upload-apk-mobile-provider.result }}"
          apk_admin_build_result="${{ needs.build-apk-mobile-admin.result }}"
          apk_admin_upload_result="${{ needs.upload-apk-mobile-admin.result }}"

          {
            echo "## Deploy Results"
            echo ""
            echo "| Servico | Planejado | Deploy | Healthcheck | Endpoint | HTTP |"
            echo "|---|---|---|---|---|---|"
            echo "| API | ${{ needs.targets.outputs.deploy_api }} | $(result_icon "$api_deploy_result") $api_deploy_result | $(result_icon "$api_health_result") $api_health_result | ${{ needs.health-api.outputs.endpoint }} | ${{ needs.health-api.outputs.http_code }} |"
            echo "| Web Landing | ${{ needs.targets.outputs.deploy_web_landing }} | $(result_icon "$landing_deploy_result") $landing_deploy_result | $(result_icon "$landing_health_result") $landing_health_result | ${{ needs.health-web-landing.outputs.endpoint }} | ${{ needs.health-web-landing.outputs.http_code }} |"
            echo "| Web Admin | ${{ needs.targets.outputs.deploy_web_admin }} | $(result_icon "$admin_deploy_result") $admin_deploy_result | $(result_icon "$admin_health_result") $admin_health_result | ${{ needs.health-web-admin.outputs.endpoint }} | ${{ needs.health-web-admin.outputs.http_code }} |"
            echo "| Web Client | ${{ needs.targets.outputs.deploy_web_client }} | $(result_icon "$client_deploy_result") $client_deploy_result | $(result_icon "$client_health_result") $client_health_result | ${{ needs.health-web-client.outputs.endpoint }} | ${{ needs.health-web-client.outputs.http_code }} |"
            echo "| Web Provider | ${{ needs.targets.outputs.deploy_web_provider }} | $(result_icon "$provider_deploy_result") $provider_deploy_result | $(result_icon "$provider_health_result") $provider_health_result | ${{ needs.health-web-provider.outputs.endpoint }} | ${{ needs.health-web-provider.outputs.http_code }} |"
            echo "| Mobile WebView Client | ${{ needs.targets.outputs.deploy_mobile_webview_client }} | $(result_icon "$mobile_webview_client_deploy_result") $mobile_webview_client_deploy_result | $(result_icon "$mobile_webview_client_health_result") $mobile_webview_client_health_result | ${{ needs.health-mobile-webview-client.outputs.endpoint }} | ${{ needs.health-mobile-webview-client.outputs.http_code }} |"
            echo "| Mobile WebView Provider | ${{ needs.targets.outputs.deploy_mobile_webview_provider }} | $(result_icon "$mobile_webview_provider_deploy_result") $mobile_webview_provider_deploy_result | $(result_icon "$mobile_webview_provider_health_result") $mobile_webview_provider_health_result | ${{ needs.health-mobile-webview-provider.outputs.endpoint }} | ${{ needs.health-mobile-webview-provider.outputs.http_code }} |"
            echo "| Mobile WebView Admin | ${{ needs.targets.outputs.deploy_mobile_webview_admin }} | $(result_icon "$mobile_webview_admin_deploy_result") $mobile_webview_admin_deploy_result | $(result_icon "$mobile_webview_admin_health_result") $mobile_webview_admin_health_result | ${{ needs.health-mobile-webview-admin.outputs.endpoint }} | ${{ needs.health-mobile-webview-admin.outputs.http_code }} |"
            echo ""
            echo "## APK Build / Upload"
            echo "| App Mobile | Build | Upload |"
            echo "|---|---|---|"
            echo "| Client | $(result_icon "$apk_client_build_result") $apk_client_build_result | $(result_icon "$apk_client_upload_result") $apk_client_upload_result |"
            echo "| Provider | $(result_icon "$apk_provider_build_result") $apk_provider_build_result | $(result_icon "$apk_provider_upload_result") $apk_provider_upload_result |"
            echo "| Admin | $(result_icon "$apk_admin_build_result") $apk_admin_build_result | $(result_icon "$apk_admin_upload_result") $apk_admin_upload_result |"
            echo ""
            echo "APK fileserver: http://${{ secrets.VPS_PUBLIC_HOST }}:8080/files/apks/"
            echo "- Cliente (debug): http://${{ secrets.VPS_PUBLIC_HOST }}:8080/files/apks/debug/ConsertaPraMim-Cliente-debug.apk"
            echo "- Cliente (compat): http://${{ secrets.VPS_PUBLIC_HOST }}:8080/files/apks/ConsertaPraMim-Cliente-compat.apk"
            echo "- Prestador (debug): http://${{ secrets.VPS_PUBLIC_HOST }}:8080/files/apks/debug/ConsertaPraMim-Prestador-debug.apk"
            echo "- Prestador (compat): http://${{ secrets.VPS_PUBLIC_HOST }}:8080/files/apks/ConsertaPraMim-Prestador-compat.apk"
            echo "- Admin (debug): http://${{ secrets.VPS_PUBLIC_HOST }}:8080/files/apks/debug/ConsertaPraMim-Admin-debug.apk"
            echo "- Admin (compat): http://${{ secrets.VPS_PUBLIC_HOST }}:8080/files/apks/ConsertaPraMim-Admin-compat.apk"
            echo ""
            echo "Mobile WebViews:"
            echo "- Cliente: http://${{ secrets.VPS_PUBLIC_HOST }}:${{ env.MOBILE_CLIENT_WEBVIEW_PORT }}/"
            echo "- Prestador: http://${{ secrets.VPS_PUBLIC_HOST }}:${{ env.MOBILE_PROVIDER_WEBVIEW_PORT }}/"
            echo "- Admin: http://${{ secrets.VPS_PUBLIC_HOST }}:${{ env.MOBILE_ADMIN_WEBVIEW_PORT }}/"
            echo "Commit: \`${{ github.sha }}\`"
            echo "Workflow: \`${{ github.workflow }}\`"
            echo "Run ID: \`${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify deploy summary push (admin)
        if: always()
        shell: bash
        env:
          APK_RELEASE_PUSH_TOKEN: ${{ secrets.APK_RELEASE_PUSH_TOKEN }}
        run: |
          if [[ -z "${APK_RELEASE_PUSH_TOKEN:-}" ]]; then
            echo "::notice::Secret APK_RELEASE_PUSH_TOKEN nao configurada. Push de resumo do deploy ignorado."
            exit 0
          fi

          endpoint="http://127.0.0.1:${{ env.API_PORT }}/api/internal/deploy/admin-summary"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          api_deploy_result="${{ needs.deploy-api.result }}"
          api_health_result="${{ needs.health-api.result }}"
          landing_deploy_result="${{ needs.deploy-web-landing.result }}"
          landing_health_result="${{ needs.health-web-landing.result }}"
          admin_deploy_result="${{ needs.deploy-web-admin.result }}"
          admin_health_result="${{ needs.health-web-admin.result }}"
          client_deploy_result="${{ needs.deploy-web-client.result }}"
          client_health_result="${{ needs.health-web-client.result }}"
          provider_deploy_result="${{ needs.deploy-web-provider.result }}"
          provider_health_result="${{ needs.health-web-provider.result }}"
          mobile_webview_client_deploy_result="${{ needs.deploy-mobile-webview-client.result }}"
          mobile_webview_client_health_result="${{ needs.health-mobile-webview-client.result }}"
          mobile_webview_provider_deploy_result="${{ needs.deploy-mobile-webview-provider.result }}"
          mobile_webview_provider_health_result="${{ needs.health-mobile-webview-provider.result }}"
          mobile_webview_admin_deploy_result="${{ needs.deploy-mobile-webview-admin.result }}"
          mobile_webview_admin_health_result="${{ needs.health-mobile-webview-admin.result }}"
          apk_client_build_result="${{ needs.build-apk-mobile-client.result }}"
          apk_client_upload_result="${{ needs.upload-apk-mobile-client.result }}"
          apk_provider_build_result="${{ needs.build-apk-mobile-provider.result }}"
          apk_provider_upload_result="${{ needs.upload-apk-mobile-provider.result }}"
          apk_admin_build_result="${{ needs.build-apk-mobile-admin.result }}"
          apk_admin_upload_result="${{ needs.upload-apk-mobile-admin.result }}"

          overall_status="success"
          for result in \
            "$api_deploy_result" "$api_health_result" \
            "$landing_deploy_result" "$landing_health_result" \
            "$admin_deploy_result" "$admin_health_result" \
            "$client_deploy_result" "$client_health_result" \
            "$provider_deploy_result" "$provider_health_result" \
            "$mobile_webview_client_deploy_result" "$mobile_webview_client_health_result" \
            "$mobile_webview_provider_deploy_result" "$mobile_webview_provider_health_result" \
            "$mobile_webview_admin_deploy_result" "$mobile_webview_admin_health_result" \
            "$apk_client_build_result" "$apk_client_upload_result" \
            "$apk_provider_build_result" "$apk_provider_upload_result" \
            "$apk_admin_build_result" "$apk_admin_upload_result"
          do
            if [[ "$result" == "failure" ]]; then
              overall_status="failure"
              break
            fi
            if [[ "$result" == "cancelled" && "$overall_status" != "failure" ]]; then
              overall_status="cancelled"
            fi
          done

          title="Deploy VPS finalizado (${overall_status})"
          summary="Run #${{ github.run_number }} - status: ${overall_status}. API deploy/health: ${api_deploy_result}/${api_health_result}. Web Landing: ${landing_deploy_result}/${landing_health_result}. Web Admin: ${admin_deploy_result}/${admin_health_result}. Web Client: ${client_deploy_result}/${client_health_result}. Web Provider: ${provider_deploy_result}/${provider_health_result}. Mobile WebView Client: ${mobile_webview_client_deploy_result}/${mobile_webview_client_health_result}. Mobile WebView Provider: ${mobile_webview_provider_deploy_result}/${mobile_webview_provider_health_result}. Mobile WebView Admin: ${mobile_webview_admin_deploy_result}/${mobile_webview_admin_health_result}. APK Client build/upload: ${apk_client_build_result}/${apk_client_upload_result}. APK Provider build/upload: ${apk_provider_build_result}/${apk_provider_upload_result}. APK Admin build/upload: ${apk_admin_build_result}/${apk_admin_upload_result}. Commit: ${{ github.sha }}."

          title_escaped="${title//\"/\\\"}"
          summary_escaped="${summary//\"/\\\"}"
          run_url_escaped="${run_url//\"/\\\"}"
          payload="{\"title\":\"${title_escaped}\",\"summary\":\"${summary_escaped}\",\"actionUrl\":\"${run_url_escaped}\",\"source\":\"github-actions\"}"

          response_file="$(mktemp)"
          http_code="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$endpoint" \
            -H "X-Deploy-Token: $APK_RELEASE_PUSH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" || true)"

          if [[ -z "$http_code" ]]; then
            http_code="000"
          fi

          if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Push de resumo de deploy enviado com sucesso (HTTP ${http_code})."
          elif [[ "$http_code" == "503" ]] && grep -q '"errorCode":"admin_summary_push_not_configured"' "$response_file"; then
            echo "::notice::Push de resumo ignorado: DeployNotifications__WebhookToken nao configurado na API em execucao."
          elif [[ "$http_code" == "404" ]]; then
            echo "::notice::Push de resumo ignorado: endpoint /api/internal/deploy/admin-summary nao encontrado na API em execucao."
          else
            echo "::notice::Falha ao enviar push de resumo do deploy (HTTP ${http_code})."
            cat "$response_file"
          fi




