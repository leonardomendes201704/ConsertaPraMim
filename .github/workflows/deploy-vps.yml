            --app provider `
            --output-dir apk-output/provider

      - name: Upload build artifact (provider)
        uses: actions/upload-artifact@v4
        with:
          name: apk-provider-package-${{ github.run_number }}
          path: |
            apk-output/provider/ConsertaPraMim-Prestador-debug.apk
            apk-output/provider/ConsertaPraMim-Prestador-compat.apk
            apk-output/provider/SHA256.txt

  upload-apk-mobile-provider:
    name: Upload APK Mobile Provider
    needs: [targets, upload-apk-mobile-client, build-apk-mobile-provider]
    if: |
      always() &&
      needs.targets.outputs.build_apk_provider == 'true' &&
      (needs.targets.outputs.build_apk_client != 'true' || needs.upload-apk-mobile-client.result == 'success') &&
      needs.build-apk-mobile-provider.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Download build artifact (provider)
        uses: actions/download-artifact@v4
        with:
          name: apk-provider-package-${{ github.run_number }}
          path: apk-upload/provider

      - name: Publish APK fileserver (provider)
        shell: bash
        run: |
          set -euo pipefail
          container_apk_dir="/srv/apks"
          container_debug_dir="/srv/apks/debug"

          docker exec --user 0 filebrowser sh -lc "mkdir -p '$container_apk_dir' '$container_debug_dir'"

          provider_metadata_path="apk-upload/provider/apk-publication-provider.json"
          cat > "$provider_metadata_path" <<EOF
          {
            "appKind": "provider",
            "fileName": "ConsertaPraMim-Prestador-compat.apk",
            "publishedAtUtc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "releaseVersion": "${{ github.sha }}",
            "runId": "${{ github.run_id }}"
          }
          EOF

          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            if [[ "$base" == *-debug.apk ]]; then
              docker cp "$file" "filebrowser:$container_debug_dir/$base"
            else
              docker cp "$file" "filebrowser:$container_apk_dir/$base"
            fi
          done < <(find "apk-upload/provider" -maxdepth 1 -type f -print0)

          docker exec --user 0 filebrowser sh -lc 'set -e; uid="$(id -u user 2>/dev/null || echo 0)"; gid="$(id -g user 2>/dev/null || echo 0)"; chown -R "$uid:$gid" /srv/apks; find /srv/apks -type d -exec chmod 775 {} \;; find /srv/apks -type f -exec chmod 664 {} \;;'

      - name: Publish APK metadata (provider)
        shell: bash
        env:
          APK_RELEASE_PUSH_TOKEN: ${{ secrets.APK_RELEASE_PUSH_TOKEN }}
        run: |
          if [[ -z "${APK_RELEASE_PUSH_TOKEN:-}" ]]; then
            echo "::notice::Secret APK_RELEASE_PUSH_TOKEN nao configurada. Metadados de APK nao publicados."
            exit 0
          fi

          internal_api_base="http://127.0.0.1:${{ env.API_PORT }}"
          metadata_url="${internal_api_base}/api/internal/deploy/apk-publication"
          payload="$(cat <<EOF
          {
            "appKind":"provider",
            "fileName":"ConsertaPraMim-Prestador-compat.apk",
            "publishedAtUtc":"$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "releaseVersion":"${{ github.sha }}",
            "runId":"${{ github.run_id }}"
          }
          EOF
          )"

          response_file="$(mktemp)"
          http_code="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$metadata_url" \
            -H "X-Deploy-Token: $APK_RELEASE_PUSH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" || true)"

          if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Metadado de APK provider publicado com sucesso (HTTP $http_code)."
          else
            echo "::notice::Falha ao publicar metadado de APK provider (HTTP ${http_code:-000})."
          fi

      - name: Notify APK release push (provider)
        shell: bash
        env:
          APK_RELEASE_PUSH_TOKEN: ${{ secrets.APK_RELEASE_PUSH_TOKEN }}
        run: |
          if [[ -z "${APK_RELEASE_PUSH_TOKEN:-}" ]]; then
            echo "::notice::Secret APK_RELEASE_PUSH_TOKEN nao configurada. Push de release ignorado."
            exit 0
          fi

          internal_api_base="http://127.0.0.1:${{ env.API_PORT }}"
          notify_url="${internal_api_base}/api/internal/deploy/apk-release"

          fileserver_host_raw="${{ secrets.VPS_PUBLIC_HOST }}"
          fileserver_host_raw="${fileserver_host_raw#http://}"
          fileserver_host_raw="${fileserver_host_raw#https://}"
          fileserver_host_raw="${fileserver_host_raw%%/*}"
          fileserver_host_raw="${fileserver_host_raw%%:*}"
          if [[ -z "$fileserver_host_raw" ]]; then
            echo "::notice::VPS_PUBLIC_HOST invalido para montar URL do fileserver no push de release."
            exit 0
          fi
          fileserver_url="http://${fileserver_host_raw}:8080/files/apks/"

          payload="$(cat <<EOF
          {
            "title":"Nova versao do app disponivel",
            "body":"Toque para abrir o fileserver e baixar o APK.",
            "fileserverUrl":"$fileserver_url",
            "targetAppKind":"provider",
            "releaseVersion":"${{ github.sha }}"
          }
          EOF
          )"

          response_file="$(mktemp)"
          http_code="$(curl -sS -o "$response_file" -w "%{http_code}" \
            -X POST "$notify_url" \
            -H "X-Deploy-Token: $APK_RELEASE_PUSH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" || true)"

          if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Push de release enviado para provider (HTTP $http_code)."
          else
            echo "::notice::Falha ao enviar push de release dos APKs (HTTP ${http_code:-000})."
          fi

