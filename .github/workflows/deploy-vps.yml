  build-apk-mobile-provider:
    name: Build APK Mobile Provider
    needs:
      - targets
      - deploy-api
      - health-api
      - deploy-web-admin
      - health-web-admin
      - deploy-web-client
      - health-web-client
      - deploy-web-provider
      - health-web-provider
    if: |
      always() &&
      needs.targets.outputs.any == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: conserta-pra-mim-provider app/package-lock.json

      - name: Setup Java
        id: setup_java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Force Java 21 for Gradle/Keytool
        shell: pwsh
        run: |
          $javaHome = "${{ steps.setup_java.outputs.path }}"
          if ([string]::IsNullOrWhiteSpace($javaHome)) {
            throw "actions/setup-java nao retornou path do JDK."
          }
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$javaHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install mobile dependencies (provider)
        shell: pwsh
        run: npm ci --prefix "conserta-pra-mim-provider app"

      - name: Build APK package (provider)
        shell: pwsh
        run: |
          python scripts/build_apks.py `
            --app provider `
            --output-dir apk-output/provider

      - name: Upload build artifact (provider)
        uses: actions/upload-artifact@v4
        with:
          name: apk-provider-package-${{ github.run_number }}
          path: |
            apk-output/provider/ConsertaPraMim-Prestador-debug.apk
            apk-output/provider/ConsertaPraMim-Prestador-compat.apk
            apk-output/provider/SHA256.txt

  upload-apk-mobile-provider:
    name: Upload APK Mobile Provider
    needs: [build-apk-mobile-provider]
    if: needs.build-apk-mobile-provider.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download build artifact (provider)
        uses: actions/download-artifact@v4
        with:
          name: apk-provider-package-${{ github.run_number }}
          path: apk-upload/provider

      - name: Write SSH key for SFTP publish
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "vps_ssh_key"
          $keyRaw = @"
          ${{ secrets.VPS_SSH_KEY }}
          "@
          $keyRaw = [string]::new($keyRaw).Trim()
          if ($keyRaw -notmatch "`n" -and $keyRaw -match '\\n') {
            $keyRaw = $keyRaw -replace '\\n', "`n"
          }
          $keyRaw = $keyRaw -replace "`r`n", "`n"
          if (-not $keyRaw.StartsWith("-----BEGIN ")) {
            throw "Secret VPS_SSH_KEY com formato inesperado (cabecalho BEGIN nao encontrado)."
          }
          [System.IO.File]::WriteAllText($keyPath, ($keyRaw + "`n"), [System.Text.UTF8Encoding]::new($false))
          $sshKeyGen = Get-Command ssh-keygen -ErrorAction SilentlyContinue
          if ($sshKeyGen) {
            & $sshKeyGen.Source -lf $keyPath | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao validar VPS_SSH_KEY com ssh-keygen."
            }
          }
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(F)" | Out-Null
          icacls $keyPath /remove:g "BUILTIN\Users" "NT AUTHORITY\Authenticated Users" "Everyone" | Out-Null
          "VPS_SSH_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish APK fileserver (provider)
        shell: pwsh
        run: |
          $sshArgs = @(
            "-i", $env:VPS_SSH_KEY_PATH,
            "-o", "StrictHostKeyChecking=no",
            "-o", "UserKnownHostsFile=/dev/null"
          )
          $hostRaw = "${{ secrets.VPS_PUBLIC_HOST }}".Trim()
          if ($hostRaw -match '^https?://') {
            $hostRaw = ([Uri]$hostRaw).Host
          } else {
            $hostRaw = $hostRaw.TrimEnd('/')
            $hostRaw = $hostRaw.Split('/')[0]
          }
          if ([string]::IsNullOrWhiteSpace($hostRaw)) {
            throw "VPS_PUBLIC_HOST invalido para SSH."
          }
          $target = "${{ env.APK_SFTP_USER }}@$hostRaw"
          $remoteDir = "${{ env.APK_SFTP_DIR }}".TrimEnd('/')
          $remoteDebugDir = "$remoteDir/debug"
          $mkdirCommand = "mkdir -p '$remoteDir' '$remoteDebugDir'"
          $mkdirOk = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $mkdirOutput = & ssh @sshArgs $target $mkdirCommand 2>&1
            $mkdirExit = $LASTEXITCODE
            if ($mkdirOutput) { $mkdirOutput | ForEach-Object { Write-Host $_ } }
            if ($mkdirExit -eq 0) {
              $mkdirOk = $true
              break
            }
            Write-Host "::warning::Tentativa $attempt/3 falhou ao preparar diretorio remoto (provider)."
            Start-Sleep -Seconds (2 * $attempt)
          }
          if (-not $mkdirOk) {
            throw "Falha ao preparar diretorio remoto para upload provider (target=$target dir=$remoteDir)."
          }
          Get-ChildItem -Path "apk-upload/provider" -File | ForEach-Object {
            $destinationDir = if ($_.Name -like "*-debug.apk") { $remoteDebugDir } else { $remoteDir }
            $destination = "${target}:${destinationDir}/"
            $sent = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              $copyOutput = & scp @sshArgs $_.FullName $destination 2>&1
              $copyExit = $LASTEXITCODE
              if ($copyOutput) { $copyOutput | ForEach-Object { Write-Host $_ } }
              if ($copyExit -eq 0) {
                $sent = $true
                break
              }
              Write-Host "::warning::Tentativa $attempt/3 falhou ao enviar arquivo provider: $($_.Name)"
              Start-Sleep -Seconds (2 * $attempt)
            }
            if (-not $sent) { throw "Falha ao enviar arquivo provider: $($_.Name)" }
          }

      - name: Notify APK release push (provider)
        shell: pwsh
        env:
          APK_RELEASE_PUSH_TOKEN: ${{ secrets.APK_RELEASE_PUSH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:APK_RELEASE_PUSH_TOKEN)) {
            Write-Host "::warning::Secret APK_RELEASE_PUSH_TOKEN nao configurada. Push de release ignorado."
            exit 0
          }
          $vpsHostRaw = "${{ secrets.VPS_PUBLIC_HOST }}".Trim().TrimEnd("/")
          $apiBase = if ($vpsHostRaw.StartsWith("http://") -or $vpsHostRaw.StartsWith("https://")) {
            $vpsHostRaw
          } else {
            "http://$vpsHostRaw"
          }
          $notifyUrl = "$apiBase:${{ env.API_PORT }}/api/internal/deploy/apk-release"
          $apiBaseUri = [System.Uri]$apiBase
          $fileserverUrl = "http://$($apiBaseUri.Host):8080/files/apks/"
          $payload = @{
            title = "Nova versao do app disponivel"
            body = "Toque para abrir o fileserver e baixar o APK."
            fileserverUrl = $fileserverUrl
            targetAppKind = "provider"
            releaseVersion = "${{ github.sha }}"
          } | ConvertTo-Json -Depth 5
          try {
            $response = Invoke-RestMethod `
              -Method Post `
              -Uri $notifyUrl `
              -Headers @{ "X-Deploy-Token" = $env:APK_RELEASE_PUSH_TOKEN } `
              -ContentType "application/json" `
              -Body $payload `
              -TimeoutSec 30
            Write-Host "Push de release enviado para appKind=$($response.targetAppKind) devices=$($response.attemptedDevices)"
          } catch {
            Write-Host "::warning::Falha ao enviar push de release dos APKs: $($_.Exception.Message)"
          }

